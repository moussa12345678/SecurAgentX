name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Ensure test deps are present
        pip install pytest pytest-asyncio pytest-timeout rich
        pip install reportlab pyjwt fastapi httpx uvicorn python-multipart
        pip install aiodocker authlib structlog cachetools selectolax lxml google-api-python-client boto3 aiohttp urllib3

    - name: Run unit tests (no network)
      run: |
        python -m pytest tests/ -v \
          -m "not integration" \
          --tb=short

    - name: Run integration tests (network, allowed to fail)
      run: |
        python -m pytest tests/ -v -m "integration" --tb=short
