<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecurAgentX — Dashboard TUI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--panel:#0d1117;--border:#1a2332;--text:#c9d1d9;--green:#39d353;--red:#f85149;--yellow:#d29922;--blue:#58a6ff;--purple:#bc8cff;--dim:#484f58;--accent:#1f6feb}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',Consolas,monospace;font-size:13px;overflow:hidden;height:100vh}
.app{display:flex;height:100vh}
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.logo{color:var(--green);font-weight:bold;font-size:15px}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{background:rgba(31,111,235,.1);border-left-color:var(--blue)}
.nav-item.active{background:rgba(31,111,235,.15);border-left-color:var(--blue);color:var(--blue)}
.nav-item .icon{width:16px;text-align:center;font-size:14px}
.sidebar-footer{padding:8px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:36px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px}
.topbar-item{color:var(--dim);font-size:11px}
.topbar-item .val{color:var(--green)}
.content{flex:1;overflow-y:auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin-bottom:16px}
.panel-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.panel-title{color:var(--green);font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.5px}
.panel-body{padding:16px}
.btn{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;transition:background .15s}
.btn:hover{background:#388bfd}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#da3633}
.btn.success{background:var(--green)}.btn.success:hover{background:#2ea043}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
select,input,textarea{background:#161b22;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-family:inherit;font-size:12px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--blue)}
input[type=range]{width:100%}
.row{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.col{flex:1;min-width:200px}
label{font-size:11px;color:var(--dim);display:block;margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:bold}
.badge.green{background:rgba(57,211,83,.15);color:var(--green)}.badge.red{background:rgba(248,81,73,.15);color:var(--red)}.badge.blue{background:rgba(88,166,255,.15);color:var(--blue)}.badge.yellow{background:rgba(210,153,34,.15);color:var(--yellow)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;color:var(--dim);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:rgba(31,111,235,.05)}
.terminal{background:#010409;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:12px;overflow:hidden}
.terminal-header{background:var(--panel);padding:6px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.terminal-dot{width:10px;height:10px;border-radius:50%}
.terminal-body{padding:12px;height:300px;overflow-y:auto;color:var(--green)}
.terminal-line{margin-bottom:2px;white-space:pre-wrap;word-break:break-all}
.terminal-input{display:flex;align-items:center;padding:8px 12px;border-top:1px solid var(--border);background:var(--panel)}
.terminal-input .prompt{color:var(--green);margin-right:6px}
.terminal-input input{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:12px;outline:none}
.code-editor{background:#010409;border:1px solid var(--border);border-radius:4px;padding:8px;color:var(--text);font-family:inherit;font-size:12px;width:100%;min-height:120px;resize:vertical;line-height:1.5;tab-size:2}
.json-editor{background:#010409;border:1px solid var(--border);border-radius:4px;padding:8px;color:var(--green);font-family:inherit;font-size:12px;width:100%;min-height:300px;resize:vertical;line-height:1.5;tab-size:2}
.toast{position:fixed;top:16px;right:16px;background:var(--panel);border:1px solid var(--green);border-radius:6px;padding:12px 20px;color:var(--green);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}.toast.error{border-color:var(--red);color:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.stat-value{font-size:22px;color:var(--green);font-weight:bold}.stat-value.blue{color:var(--blue)}.stat-value.yellow{color:var(--yellow)}
.chat-log{height:300px;overflow-y:auto;padding:12px;border:1px solid var(--border);border-radius:4px;background:#010409;margin-bottom:8px}
.chat-msg{margin-bottom:8px;padding:6px 10px;border-radius:4px;font-size:12px}
.chat-msg.user{background:rgba(88,166,255,.1);border-left:2px solid var(--blue)}.chat-msg.ai{background:rgba(57,211,83,.1);border-left:2px solid var(--green)}
.chat-msg .role{font-size:10px;color:var(--dim);margin-bottom:2px}
.toggle{position:relative;width:40px;height:20px;background:var(--border);border-radius:10px;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--green)}.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}.toggle.on::after{transform:translateX(20px)}
.skill-list{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:4px}
.skill-item{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.skill-item:hover{background:rgba(31,111,235,.05)}.skill-item:last-child{border-bottom:none}
.skill-name{color:var(--green);font-size:12px}.skill-cat{font-size:10px;color:var(--dim)}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden}.progress-bar{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="sidebar-header"><span style="font-size:18px">🛡️</span><span class="logo">SecurAgentX</span></div>
<nav class="nav" id="nav">
<div class="nav-item active" data-view="dashboard" onclick="nav('dashboard')"><span class="icon">📊</span> Dashboard</div>
<div class="nav-item" onclick="nav('provider')" data-view="provider"><span class="icon">🤖</span> AI Provider</div>
<div class="nav-item" onclick="nav('skills')" data-view="skills"><span class="icon">⚡</span> Skills Manager</div>
<div class="nav-item" onclick="nav('tools')" data-view="tools"><span class="icon">🔧</span> Tools (47)</div>
<div class="nav-item" onclick="nav('config')" data-view="config"><span class="icon">⚙️</span> Config Editor</div>
<div class="nav-item" onclick="nav('scope')" data-view="scope"><span class="icon">🎯</span> Scope Manager</div>
<div class="nav-item" onclick="nav('terminal')" data-view="terminal"><span class="icon">💻</span> Terminal</div>
<div class="nav-item" onclick="nav('chat')" data-view="chat"><span class="icon">💬</span> AI Chat</div>
<div class="nav-item" onclick="nav('hunt')" data-view="hunt"><span class="icon">🔍</span> Hunt Control</div>
<div class="nav-item" onclick="nav('memory')" data-view="memory"><span class="icon">🧠</span> Memory & KG</div>
</nav>
<div class="sidebar-footer">
<div>Provider: <span id="sb-provider" style="color:var(--green)">openrouter</span></div>
<div>Model: <span id="sb-model" style="color:var(--blue)">—</span></div>
<div style="margin-top:4px">v1.0.1 | GPL-3.0</div>
</div>
</aside>
<div class="main">
<div class="topbar">
<span class="topbar-item">● <span class="val">ONLINE</span></span>
<span class="topbar-item">Tools: <span class="val" id="tb-tools">47</span></span>
<span class="topbar-item">Skills: <span class="val" id="tb-skills">0</span></span>
<span class="topbar-item">Mode: <span class="val" id="tb-mode">single</span></span>
<span class="topbar-item" style="margin-left:auto">⏱ <span id="tb-time">--:--:--</span></span>
</div>
<div class="content" id="content"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const S={load(){try{return JSON.parse(localStorage.getItem('securagentx')||'{}')}catch(e){return{}}},save(d){localStorage.setItem('securagentx',JSON.stringify(d))},get(k,d){const s=this.load();return s[k]!==undefined?s[k]:d},set(k,v){const s=this.load();s[k]=v;this.save(s)}};
const defaultConfig={agent:{max_output_chars:8000,max_steps:100,timeout_seconds:3600},ai:{active_provider:"openrouter",providers:{openrouter:{model:"nvidia/nemotron-3-ultra-550b-a55b:free"},openai:{model:"gpt-4o-mini"},anthropic:{model:"claude-3-5-sonnet-latest"},gemini:{model:"gemini-2.0-flash-exp"},groq:{model:"llama-3.3-70b-versatile"},ollama:{model:"llama3.2"}}},scope:{domains:["example.com","testphp.vulnweb.com"]}};
const providers=[{id:"openrouter",name:"OpenRouter",models:["nvidia/nemotron-3-ultra-550b-a55b:free","meta-llama/llama-3.3-70b-instruct","meta-llama/llama-3.2-3b-instruct:free","google/gemini-2.0-flash-exp:free"]},{id:"openai",name:"OpenAI",models:["gpt-4o","gpt-4o-mini","gpt-3.5-turbo"]},{id:"anthropic",name:"Anthropic",models:["claude-3-5-sonnet-latest","claude-3-5-haiku-latest","claude-3-opus-latest"]},{id:"gemini",name:"Google Gemini",models:["gemini-2.0-flash-exp","gemini-1.5-flash","gemini-1.5-pro"]},{id:"groq",name:"Groq",models:["llama-3.3-70b-versatile","llama-3.1-8b-instant","mixtral-8x7b-32768"]},{id:"ollama",name:"Ollama (Local)",models:["llama3.2","llama3.1","mistral","qwen2.5"]}];
const aiTools=[{name:"port_scan",desc:"Scan target for open ports"},{name:"web_recon",desc:"Probe web server headers/tech"},{name:"vuln_scan",desc:"Run vulnerability scanner"},{name:"search_cve",desc:"Search known CVEs"},{name:"analyze_target",desc:"DNS/WHOIS/tech detection"},{name:"web_search",desc:"Search the web (DuckDuckGo)"},{name:"web_extract",desc:"Extract text from URL"},{name:"browser",desc:"Playwright headless browser"},{name:"read_file",desc:"Read file with line numbers"},{name:"write_file",desc:"Create/overwrite file"},{name:"edit_file",desc:"Find & replace in file"},{name:"search_files",desc:"Search files with regex"},{name:"run_command",desc:"Execute shell command"},{name:"run_python",desc:"Execute Python code"},{name:"analyze_security",desc:"Deep AI security analysis"},{name:"delegate",desc:"Spawn AI sub-agents per target"},{name:"create_tool",desc:"Create new tool at runtime"},{name:"edit_own_tool",desc:"Modify created tools"},{name:"save_memory",desc:"Save to persistent memory"},{name:"recall_memory",desc:"Search cross-session memory"},{name:"list_memories",desc:"List memory entries"},{name:"forget_memory",desc:"Remove memory by ID"},{name:"create_skill",desc:"Save reusable technique"},{name:"view_skill",desc:"Read skill by name"},{name:"list_skills",desc:"List all skills"},{name:"delete_skill",desc:"Remove skill by name"},{name:"knowledge_graph",desc:"Query/update knowledge graph"}];
const registryTools=[{n:"active_fuzzer",c:"fuzzing",a:true},{n:"amass",c:"recon",a:false},{n:"api_schema_diff",c:"api",a:true},{n:"arjun",c:"api",a:false},{n:"cors_checker",c:"scanner",a:true},{n:"crackmapexec",c:"exploit",a:false},{n:"deserialization_scanner",c:"scanner",a:true},{n:"dirb",c:"recon",a:false},{n:"dirsearch",c:"fuzzing",a:false},{n:"dnsenum",c:"recon",a:false},{n:"dnsrecon",c:"recon",a:false},{n:"dynamic_waf_mutator",c:"exploit",a:true},{n:"enum4linux",c:"scanner",a:false},{n:"feroxbuster",c:"fuzzing",a:false},{n:"ffuf",c:"fuzzing",a:false},{n:"gobuster",c:"recon",a:false},{n:"graphql_scanner",c:"api",a:true},{n:"httpx",c:"recon",a:true},{n:"hydra",c:"exploit",a:false},{n:"jwt_tester",c:"scanner",a:true},{n:"kiterunner",c:"api",a:false},{n:"logic_flaw_engine",c:"scanner",a:true},{n:"masscan",c:"network",a:false},{n:"naabu",c:"network",a:false},{n:"nbtscan",c:"network",a:false},{n:"nikto",c:"scanner",a:false},{n:"nmap",c:"network",a:false},{n:"nuclei",c:"scanner",a:false},{n:"python_recon",c:"recon",a:true},{n:"race_condition_tester",c:"scanner",a:true},{n:"smap",c:"network",a:false},{n:"smbclient",c:"recon",a:false},{n:"sqlmap",c:"exploit",a:false},{n:"sslscan",c:"scanner",a:false},{n:"sslyze",c:"scanner",a:false},{n:"ssrf_scanner",c:"scanner",a:true},{n:"ssti_scanner",c:"scanner",a:true},{n:"subfinder",c:"recon",a:false},{n:"supply_chain_analyzer",c:"scanner",a:true},{n:"testssl",c:"scanner",a:false},{n:"theHarvester",c:"recon",a:false},{n:"trufflehog",c:"secrets",a:false},{n:"waf_detector",c:"scanner",a:true},{n:"wafw00f",c:"recon",a:false},{n:"whatweb",c:"recon",a:false},{n:"wpscan",c:"scanner",a:false},{n:"xxe_scanner",c:"scanner",a:true}];
const mandatorySkills=[{name:"red_team_methodology",desc:"MITRE ATT&CK red team methodology"},{name:"hacking_workflow",desc:"Standard hacking workflow: recon→scan→exploit→report"},{name:"bug_bounty_methodology",desc:"Bug bounty hunting methodology"},{name:"owasp_top_10",desc:"OWASP Top 10 2021 testing checklist"},{name:"pentest_checklist",desc:"Comprehensive pentest checklist"}];
function toast(m,e){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' error':'');setTimeout(()=>t.className='toast',2500)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function updateSB(){const c=S.get('config',defaultConfig);document.getElementById('sb-provider').textContent=c.ai.active_provider;const p=c.ai.providers[c.ai.active_provider];document.getElementById('sb-model').textContent=p?p.model:'—';document.getElementById('tb-skills').textContent=S.get('skills',[]).length}
const V={};
V.dashboard=function(){const c=S.get('config',defaultConfig);const sk=S.get('skills',[]);const av=registryTools.filter(t=>t.a).length;return`<div class="stat-grid"><div class="stat-card"><div class="stat-label">AI Tools</div><div class="stat-value">${aiTools.length}</div></div><div class="stat-card"><div class="stat-label">Registry</div><div class="stat-value blue">${registryTools.length}</div></div><div class="stat-card"><div class="stat-label">Available</div><div class="stat-value yellow">${av}</div></div><div class="stat-card"><div class="stat-label">Skills</div><div class="stat-value">${sk.length+5}</div></div><div class="stat-card"><div class="stat-label">Max Steps</div><div class="stat-value blue">${c.agent.max_steps}</div></div><div class="stat-card"><div class="stat-label">Provider</div><div class="stat-value yellow" style="font-size:14px">${c.ai.active_provider}</div></div></div><div class="row"><div class="col"><div class="panel"><div class="panel-header"><span class="panel-title">Hunt Status</span></div><div class="panel-body"><div class="row"><label>Target</label><input id="d-tgt" placeholder="example.com" value="${S.get('lastTarget','')}" style="width:100%"></div><div class="row"><label>Mode</label><select id="d-mode"><option value="single">Single-Agent</option><option value="multi">Multi-Agent</option></select><label>YOLO</label><div class="toggle ${S.get('yolo',false)?'on':''}" id="d-yolo"></div></div><button class="btn success" onclick="dHunt()">🚀 Start Hunt</button></div></div></div><div class="col"><div class="panel"><div class="panel-header"><span class="panel-title">Quick Actions</span></div><div class="panel-body"><button class="btn" onclick="nav('provider')">⚙️ Change Provider</button><br><br><button class="btn" onclick="nav('skills')">⚡ Manage Skills</button><br><br><button class="btn" onclick="nav('config')">📝 Edit Config</button><br><br><button class="btn" onclick="nav('terminal')">💻 Open Terminal</button></div></div></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Mandatory Pre-Hunt Skills</span></div><div class="panel-body">${mandatorySkills.map(s=>`<div style="margin-bottom:6px"><span class="badge green">✓</span> <span style="color:var(--green)">${s.name}</span> <span style="color:var(--dim);font-size:11px">— ${s.desc}</span></div>`).join('')}</div></div>`};
V.provider=function(){const c=S.get('config',defaultConfig);return`<div class="panel"><div class="panel-header"><span class="panel-title">AI Provider</span></div><div class="panel-body"><div class="row"><div class="col"><label>Provider</label><select id="p-sel" onchange="pUpd()">${providers.map(p=>`<option value="${p.id}" ${p.id===c.ai.active_provider?'selected':''}>${p.name}</option>`).join('')}</select></div></div><div id="p-mods"></div><div class="row"><div class="col"><label>API Key</label><input type="password" id="p-key" placeholder="••••••••" style="width:100%"></div></div><button class="btn success" onclick="pSave()">💾 Save</button></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Providers</span></div><div class="panel-body"><table><tr><th>Provider</th><th>Free</th><th>Tool Calls</th><th>Status</th></tr><tr><td>OpenRouter</td><td><span class="badge green">50/day</span></td><td>✅</td><td><span class="badge green">Active</span></td></tr><tr><td>OpenAI</td><td>❌</td><td>✅</td><td>—</td></tr><tr><td>Anthropic</td><td>❌</td><td>✅</td><td>—</td></tr><tr><td>Google Gemini</td><td><span class="badge green">15/min</span></td><td>✅</td><td>—</td></tr><tr><td>Groq</td><td><span class="badge green">Yes</span></td><td>✅</td><td>—</td></tr><tr><td>Ollama</td><td><span class="badge green">Local</span></td><td>✅</td><td>—</td></tr></table></div></div>`};
V.skills=function(){const sk=S.get('skills',[]);return`<div class="panel"><div class="panel-header"><span class="panel-title">Add Skill</span></div><div class="panel-body"><div class="row"><div class="col"><label>Name</label><input id="sk-n" placeholder="translate_text" style="width:100%"></div><div class="col"><label>Category</label><select id="sk-c"><option>recon</option><option>web</option><option>network</option><option>exploit</option><option>custom</option></select></div></div><div class="row"><div class="col" style="min-width:100%"><label>Description</label><input id="sk-d" placeholder="Translate text" style="width:100%"></div></div><div class="row"><div class="col" style="min-width:100%"><label>Code (JavaScript)</label><textarea class="code-editor" id="sk-code" placeholder="// function handler(args) { ... }"></textarea></div></div><button class="btn success" onclick="skAdd()">➕ Add Skill</button></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Skills (${sk.length+5} mandatory + ${sk.length} custom)</span></div><div class="panel-body"><div class="skill-list">${mandatorySkills.map(s=>`<div class="skill-item"><div><span class="skill-name">${s.name}</span><br><span class="skill-cat">${s.desc}</span></div><span class="badge green">mandatory</span></div>`).join('')}${sk.map((s,i)=>`<div class="skill-item"><div><span class="skill-name">${esc(s.name)}</span> <span class="skill-cat">[${s.category}]</span><br><span class="skill-cat">${esc(s.desc||'')}</span></div><div><button class="btn sm ghost" onclick="skEdit(${i})">✏️</button> <button class="btn sm danger" onclick="skDel(${i})">🗑️</button></div></div>`).join('')}</div></div></div>`};
V.tools=function(){return`<div class="panel"><div class="panel-header"><span class="panel-title">AI Tools (${aiTools.length})</span></div><div class="panel-body"><table><tr><th>#</th><th>Tool</th><th>Description</th></tr>${aiTools.map((t,i)=>`<tr><td>${i+1}</td><td style="color:var(--green)">${t.name}</td><td>${t.desc}</td></tr>`).join('')}</table></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Registry (${registryTools.length}) — ${registryTools.filter(t=>t.a).length} available</span></div><div class="panel-body"><table><tr><th>Tool</th><th>Category</th><th>Status</th><th>Install</th></tr>${registryTools.map(t=>`<tr><td style="color:var(--green)">${t.n}</td><td>${t.c}</td><td>${t.a?'<span class="badge green">✓</span>':'<span class="badge red">✗</span>'}</td><td>${t.a?'—':`<code>apt install ${t.n}</code>`}</td></tr>`).join('')}</table></div></div>`};
V.config=function(){const c=S.get('config',defaultConfig);return`<div class="panel"><div class="panel-header"><span class="panel-title">JSON Editor</span><button class="btn success sm" onclick="cfgSave()">💾 Save</button></div><div class="panel-body"><textarea class="json-editor" id="cfg-j">${esc(JSON.stringify(c,null,2))}</textarea></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Quick Settings</span></div><div class="panel-body"><div class="row"><div class="col"><label>Max Steps: <span id="ms-v" style="color:var(--green)">${c.agent.max_steps}</span></label><input type="range" min="10" max="200" value="${c.agent.max_steps}" onchange="document.getElementById('ms-v').textContent=this.value;cfgSet('agent','max_steps',parseInt(this.value))"></div><div class="col"><label>Timeout: <span id="to-v" style="color:var(--green)">${c.agent.timeout_seconds}</span></label><input type="range" min="30" max="7200" value="${c.agent.timeout_seconds}" onchange="document.getElementById('to-v').textContent=this.value;cfgSet('agent','timeout_seconds',parseInt(this.value))"></div></div></div></div>`};
V.scope=function(){const c=S.get('config',defaultConfig);const d=c.scope?.domains||[];return`<div class="panel"><div class="panel-header"><span class="panel-title">Scope (Advisory — Non-Blocking)</span></div><div class="panel-body"><div class="row"><div class="col"><input id="sc-add" placeholder="example.com" style="width:100%"></div><button class="btn success" onclick="scAdd()">➕ Add</button></div><div class="skill-list">${d.map((x,i)=>`<div class="skill-item"><div><span class="skill-name">${esc(x)}</span></div><button class="btn sm danger" onclick="scDel(${i})">🗑️</button></div>`).join('')}</div><div style="margin-top:12px;padding:8px;background:rgba(210,153,34,.1);border-radius:4px;color:var(--yellow);font-size:11px">⚠ Advisory only — targets not in scope proceed with a warning.</div></div></div>`};
V.terminal=function(){return`<div class="terminal"><div class="terminal-header"><span class="terminal-dot" style="background:#f85149"></span><span class="terminal-dot" style="background:#d29922"></span><span class="terminal-dot" style="background:#39d353"></span><span style="color:var(--dim);font-size:11px;margin-left:8px">securagentx@dashboard</span></div><div class="terminal-body" id="t-body"><div class="terminal-line">SecurAgentX Terminal v1.0.1</div><div class="terminal-line">Type 'help' for commands.</div><div class="terminal-line">&nbsp;</div></div><div class="terminal-input"><span class="prompt">$</span><input id="t-in" autofocus onkeydown="tKey(event)" placeholder="type a command..."></div></div><div class="panel" style="margin-top:12px"><div class="panel-header"><span class="panel-title">Commands</span></div><div class="panel-body" style="font-size:11px;line-height:1.8"><code style="color:var(--green)">help</code> | <code style="color:var(--green)">config show</code> | <code style="color:var(--green)">config set &lt;s&gt; &lt;k&gt; &lt;v&gt;</code> | <code style="color:var(--green)">provider set &lt;id&gt;</code> | <code style="color:var(--green)">skills list</code> | <code style="color:var(--green)">scope add &lt;domain&gt;</code> | <code style="color:var(--green)">tools list</code> | <code style="color:var(--green)">hunt &lt;target&gt;</code> | <code style="color:var(--green)">mode single|multi|yolo</code> | <code style="color:var(--green)">clear</code></div></div>`};
V.chat=function(){const c=S.get('config',defaultConfig);return`<div class="panel"><div class="panel-header"><span class="panel-title">AI Chat</span><span style="font-size:11px;color:var(--dim)">${c.ai.active_provider}</span></div><div class="panel-body"><div class="chat-log" id="c-log"><div class="chat-msg ai"><div class="role">AI</div>SecurAgentX ready. Ask me anything.</div></div><div class="row"><input id="c-in" placeholder="Ask AI..." style="flex:1" onkeydown="if(event.key==='Enter')cSend()"><button class="btn success" onclick="cSend()">Send</button></div></div></div>`};
V.hunt=function(){const c=S.get('config',defaultConfig);return`<div class="panel"><div class="panel-header"><span class="panel-title">Hunt Control</span></div><div class="panel-body"><div class="row"><div class="col"><label>Target</label><input id="h-tgt" placeholder="testphp.vulnweb.com" value="${S.get('lastTarget','')}" style="width:100%"></div></div><div class="row"><div class="col"><label>Mode</label><select id="h-mode"><option value="single">Single-Agent</option><option value="multi">Multi-Agent</option></select></div><div class="col"><label>Steps</label><input type="number" id="h-steps" value="${c.agent.max_steps}" min="10" max="200"></div><div class="col"><label>YOLO</label><div class="toggle ${S.get('yolo',false)?'on':''}" id="h-yolo" onclick="this.classList.toggle('on')"></div></div></div><button class="btn success" onclick="hStart()">🚀 Launch</button> <button class="btn danger" onclick="hStop()">⏹️ Stop</button></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Progress</span></div><div class="panel-body"><div class="progress"><div class="progress-bar" id="h-prog" style="width:0%"></div></div><div id="h-log" style="margin-top:8px;font-size:11px;color:var(--dim);max-height:200px;overflow-y:auto">No hunt running.</div></div></div>`};
V.memory=function(){const m=S.get('memories',[]);const kg=S.get('knowledgeGraph',{nodes:[]});return`<div class="panel"><div class="panel-header"><span class="panel-title">Memory (${m.length})</span></div><div class="panel-body"><div class="row"><input id="m-in" placeholder="Save memory..." style="flex:1" onkeydown="if(event.key==='Enter')mAdd()"><button class="btn success" onclick="mAdd()">💾</button></div><div class="skill-list">${m.length?m.map((x,i)=>`<div class="skill-item"><div><span class="skill-cat">${new Date(x.ts).toLocaleString()}</span><br><span style="font-size:12px">${esc(x.text)}</span></div><button class="btn sm danger" onclick="mDel(${i})">🗑️</button></div>`).join(''):'<div style="padding:12px;color:var(--dim);text-align:center">No memories yet.</div>'}</div></div></div><div class="panel"><div class="panel-header"><span class="panel-title">Knowledge Graph (${kg.nodes?.length||0} nodes)</span></div><div class="panel-body"><div class="row"><input id="kg-in" placeholder="Add node..." style="flex:1"><button class="btn success" onclick="kgAdd()">➕</button></div><div class="skill-list">${kg.nodes?.length?kg.nodes.map((n,i)=>`<div class="skill-item"><div><span class="skill-name">${esc(n)}</span></div><button class="btn sm danger" onclick="kgDel(${i})">🗑️</button></div>`).join(''):'<div style="padding:12px;color:var(--dim);text-align:center">No nodes.</div>'}</div></div></div>`};
function nav(v){document.querySelectorAll('.nav-item').forEach(e=>e.classList.toggle('active',e.dataset.view===v));document.getElementById('content').innerHTML=V[v]();if(v==='provider')setTimeout(pUpd,50);updateSB()}
function pUpd(){const c=S.get('config',defaultConfig);const sel=document.getElementById('p-sel');if(!sel)return;const p=providers.find(x=>x.id===sel.value);const cur=c.ai.providers[sel.value];const cm=cur?cur.model:'';document.getElementById('p-mods').innerHTML=`<div class="row"><div class="col"><label>Model</label><select id="p-mod">${p.models.map(m=>`<option value="${m}" ${m===cm?'selected':''}>${m}</option>`).join('')}</select></div></div>`}
function pSave(){const c=S.get('config',defaultConfig);const pid=document.getElementById('p-sel').value;const mid=document.getElementById('p-mod').value;c.ai.active_provider=pid;if(!c.ai.providers[pid])c.ai.providers[pid]={};c.ai.providers[pid].model=mid;S.set('config',c);updateSB();toast('✓ Provider: '+pid+' / '+mid)}
function skAdd(){const n=document.getElementById('sk-n').value.trim();if(!n){toast('Name required',true);return}const sk=S.get('skills',[]);sk.push({name:n,category:document.getElementById('sk-c').value,desc:document.getElementById('sk-d').value,code:document.getElementById('sk-code').value});S.set('skills',sk);toast('✓ Skill: '+n);nav('skills')}
function skDel(i){const sk=S.get('skills',[]);sk.splice(i,1);S.set('skills',sk);nav('skills')}
function skEdit(i){const sk=S.get('skills',[]);const s=sk[i];document.getElementById('sk-n').value=s.name;document.getElementById('sk-c').value=s.category;document.getElementById('sk-d').value=s.desc||'';document.getElementById('sk-code').value=s.code||'';sk.splice(i,1);S.set('skills',sk);toast('Edit and click Add')}
function cfgSave(){try{S.set('config',JSON.parse(document.getElementById('cfg-j').value));updateSB();toast('✓ Config saved')}catch(e){toast('JSON Error: '+e.message,true)}}
function cfgSet(s,k,v){const c=S.get('config',defaultConfig);if(!c[s])c[s]={};c[s][k]=v;S.set('config',c);toast('✓ '+s+'.'+k+' = '+v)}
function scAdd(){const v=document.getElementById('sc-add').value.trim();if(!v)return;const c=S.get('config',defaultConfig);if(!c.scope)c.scope={domains:[]};if(!c.scope.domains)c.scope.domains=[];c.scope.domains.push(v);S.set('config',c);toast('✓ '+v);nav('scope')}
function scDel(i){const c=S.get('config',defaultConfig);c.scope.domains.splice(i,1);S.set('config',c);nav('scope')}
function mAdd(){const v=document.getElementById('m-in').value.trim();if(!v)return;const m=S.get('memories',[]);m.unshift({text:v,ts:Date.now()});S.set('memories',m);nav('memory')}
function mDel(i){const m=S.get('memories',[]);m.splice(i,1);S.set('memories',m);nav('memory')}
function kgAdd(){const v=document.getElementById('kg-in').value.trim();if(!v)return;const kg=S.get('knowledgeGraph',{nodes:[]});if(!kg.nodes)kg.nodes=[];kg.nodes.push(v);S.set('knowledgeGraph',kg);nav('memory')}
function kgDel(i){const kg=S.get('knowledgeGraph',{nodes:[]});kg.nodes.splice(i,1);S.set('knowledgeGraph',kg);nav('memory')}
function dHunt(){const t=document.getElementById('d-tgt').value.trim();if(!t){toast('Target required',true);return}S.set('lastTarget',t);toast('🚀 Hunt: '+t)}
function cSend(){const i=document.getElementById('c-in');const v=i.value.trim();if(!v)return;const l=document.getElementById('c-log');l.innerHTML+=`<div class="chat-msg user"><div class="role">You</div>${esc(v)}</div>`;i.value='';setTimeout(()=>{l.innerHTML+=`<div class="chat-msg ai"><div class="role">AI</div>Received: "${esc(v)}". In live mode this connects to the LLM provider.</div>`;l.scrollTop=l.scrollHeight},500);l.scrollTop=l.scrollHeight}
function hStart(){const t=document.getElementById('h-tgt').value.trim();if(!t){toast('Target required',true);return}S.set('lastTarget',t);const s=parseInt(document.getElementById('h-steps').value);toast('🚀 Hunt started');const log=document.getElementById('h-log');log.innerHTML='';let st=0;const iv=setInterval(()=>{st++;document.getElementById('h-prog').style.width=Math.min(st/s*100,100)+'%';log.innerHTML+=`<div>Step ${st}/${s}...</div>`;log.scrollTop=log.scrollHeight;if(st>=s||st>=10){clearInterval(iv);log.innerHTML+=`<div style="color:var(--green)">✓ Complete. Report in ~/.securagentx/reports/</div>`}},500)}
function hStop(){document.getElementById('h-prog').style.width='0%';document.getElementById('h-log').innerHTML='Stopped.';toast('⏹️ Stopped')}
const tCmds={help(){return'Commands: help, config show, config set <s> <k> <v>, provider set <id>, provider list, skills list, skills add <name>, scope add <domain>, scope list, tools list, hunt <target>, mode single|multi|yolo, clear'},'config show'(){return JSON.stringify(S.get('config',defaultConfig),null,2)},'config set'(a){const[sec,key,...v]=a.split(' ');cfgSet(sec,key,v.join(' '));return'✓ '+sec+'.'+key+' set'},'provider list'(){return providers.map(p=>p.id+' — '+p.name).join('\n')},'provider set'(a){const c=S.get('config',defaultConfig);c.ai.active_provider=a.trim();S.set('config',c);updateSB();return'✓ Provider: '+a.trim()},'skills list'(){const sk=S.get('skills',[]);return[...mandatorySkills.map(s=>'✓ '+s.name),...sk.map(s=>'  '+s.name)].join('\n')},'skills add'(a){const sk=S.get('skills',[]);sk.push({name:a.trim(),category:'custom',desc:'',code:''});S.set('skills',sk);updateSB();return'✓ Skill: '+a.trim()},'scope add'(a){const c=S.get('config',defaultConfig);if(!c.scope)c.scope={domains:[]};c.scope.domains.push(a.trim());S.set('config',c);return'✓ Scope: '+a.trim()},'scope list'(){return(S.get('config',defaultConfig).scope?.domains||[]).join('\n')||'Empty'},'tools list'(){return aiTools.map(t=>t.name).join('\n')},'hunt'(a){S.set('lastTarget',a.trim());return'🚀 Hunt: '+a.trim()},'mode'(a){if(a.trim()==='yolo'){S.set('yolo',!S.get('yolo',false));return'YOLO: '+(S.get('yolo',false)?'ON':'OFF')}document.getElementById('tb-mode').textContent=a.trim();return'Mode: '+a.trim()},clear(){document.getElementById('t-body').innerHTML='';return''}};
function tKey(e){if(e.key!=='Enter')return;const inp=document.getElementById('t-in');const cmd=inp.value.trim();inp.value='';const b=document.getElementById('t-body');b.innerHTML+=`<div class="terminal-line"><span style="color:var(--green)">$</span> ${esc(cmd)}</div>`;if(!cmd){b.innerHTML+='<div class="terminal-line">&nbsp;</div>';return}const parts=cmd.split(/\s+/);const fn=parts[0]+(parts[1]&&['set','show','list','add'].includes(parts[1])?' '+parts[1]:'');const args=cmd.substring(fn.length).trim();const h=tCmds[fn];if(h){const r=h(args);if(r)b.innerHTML+=`<div class="terminal-line">${esc(r).replace(/\n/g,'<br>')}</div>`}else{b.innerHTML+=`<div class="terminal-line" style="color:var(--red)">Unknown: ${esc(cmd)}</div>`}b.innerHTML+='<div class="terminal-line">&nbsp;</div>';b.scrollTop=b.scrollHeight}
setInterval(()=>{document.getElementById('tb-time').textContent=new Date().toLocaleTimeString()},1000);
if(!S.get('config'))S.set('config',defaultConfig);
nav('dashboard');
</script>
</body>
</html>
