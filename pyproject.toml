[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securagentx"
version = "1.0.1"
description = "Autonomous AI Agent Framework for Security Research"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
authors = [
    {name = "SecurAgentX Project"},
]
keywords = [
    "security", "pentesting", "bug-bounty", "vulnerability",
    "ai-agent", "automation", "oscp", "reconnaissance", "cvss",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # Core
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    # urllib3 — top-level `from urllib3.util.retry import Retry` in
    # tools/python_recon.py and tools/api_finder.py (also transitively
    # installed by requests, but pinned here because we import it directly).
    "urllib3>=2.0",
    # Data validation — used by agents, flows, providers
    "pydantic>=2.0.0",
    # AI / LLM SDKs
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.3.0",
    # Telegram
    "python-telegram-bot>=20.0",
    # CLI UI
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.41.0",
    # Async
    "nest-asyncio>=1.6.0",
    "tenacity>=8.0.0",
    "aiosqlite>=0.19.0",
    # Knowledge graph (local Graphiti replacement)
    "networkx>=3.0",
    # Token counting
    "tiktoken>=0.5.0",
    # Vector memory
    "chromadb>=1.5.9",  # CVE-2026-45829: Pre-auth RCE — pin to latest available patched release
    # XXE defense — securagentx/search_providers/duckduckgo.py + tools/report_gen.py
    "defusedxml>=0.7.1",
    # Web intelligence
    "trafilatura>=1.6.0",
    "googlesearch-python>=1.2.0",
    "duckduckgo-search>=4.0.0",
    # Markdown rendering — securagentx.reports.export.render_html (no fallback)
    "markdown-it-py>=3.0",
    "jinja2>=3.1",  # Template rendering for agent prompts
    # Auth — signed-cookie session primitive (securagentx.auth.sessions)
    "itsdangerous>=2.1.0",
    # GraphQL API — strawberry.fastapi.GraphQLRouter (securagentx.graphql)
    "fastapi>=0.110.0",
    "strawberry-graphql>=0.220.0",
    # MCP (Model Context Protocol) - requires npm/node
    # Sequential Thinking: npx -y mcp-sequential-thinking
    # Memory: npx -y @modelcontextprotocol/server-memory
    # Filesystem: npx -y @modelcontextprotocol/server-filesystem
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.1.0",
    "black",
    "isort",
    "flake8",
    "mypy",
    "ruff",
]
api = [
    "httpx>=0.24.0",
    "pyjwt>=2.8.0",
    # ASGI server — tools/api_server.py:run_server (lazy import)
    "uvicorn>=0.27",
    # Starlette middleware/exceptions — securagentx/api/app.py + securagentx/auth/oauth.py
    # (fastapi already transitively installs starlette; pinned for direct imports)
    "starlette>=0.36",
    # TTLCache for securagentx/api/_auth.py (has a dict-based fallback if missing)
    "cachetools>=5.3",
]
oauth = [
    "authlib>=1.3.0",
]
observability = [
    "structlog>=24.1.0",
]
docker = [
    # Native async Docker client — securagentx/docker/{sandbox,lifecycle,network}.py
    # Lazy-imported with a fallback to the synchronous docker SDK so the package
    # remains importable in Docker-less environments.
    "aiodocker>=0.21",
]
reports = [
    # PDF rendering — securagentx/reports/{export,pdf}.py (lazy fallback renderer)
    "reportlab>=4.0",
]
# Async HTTP — try/except or lazy-imported in tools/{zero_day_heuristics,
# targeted_attacks, auth_session, endpoint_discovery, exploitation,
# native_scanner, logic_flaw_engine, hunt_engine}.py and mcp/client.py.
# Optional: each call site degrades gracefully (sets aiohttp=None / raises
# a helpful ImportError when the feature is actually exercised).
async = [
    "aiohttp>=3.9",
]
# Search providers — all lazy-imported inside securagentx/search_providers/
# so the package imports cleanly for AST-level test discovery even when
# these packages are absent.
search = [
    # DuckDuckGo HTML parsing — search_providers/duckduckgo.py:_parse_with_lxml
    "lxml>=5.0",
    # Fallback HTML parser when lxml is unavailable — duckduckgo.py:_parse_with_selectolax
    "selectolax>=0.3",
    # Google Custom Search JSON API — search_providers/google.py:_run_sync (lazy)
    "google-api-python-client>=2.100",
]
# AWS Bedrock provider — securagentx/providers/bedrock.py (try/except ImportError
# inside _ensure_runtime_client; raises a helpful RuntimeError only when the
# Bedrock provider is actually selected).
aws = [
    "boto3>=1.34",
]

[project.scripts]
securagentx = "main:main"

[project.urls]
Homepage = "https://github.com/moussa12345678/SecurAgentX"
Repository = "https://github.com/moussa12345678/SecurAgentX"
Issues = "https://github.com/moussa12345678/SecurAgentX/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*", "scripts*", "data*", "reports*", "examples*", "htmlcov*", "docs*", ".config*", ".cache*", "build*", "dist*", ".mimocode*", ".remember*"]

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.txt", "*.yaml", "*.md", "*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Narrowed filterwarnings — do NOT blanket-ignore DeprecationWarning.
# Show each unique deprecation/pending-deprecation warning once (default action)
# so regressions surface instead of being silently swallowed.
# Tests that assert on warnings use local `warnings.catch_warnings()` +
# `warnings.simplefilter("always")`, which override these globally.
filterwarnings = [
    "default::DeprecationWarning",
    "default::PendingDeprecationWarning",
    "default::ResourceWarning",
]
markers = [
    "integration: opt-in integration tests that hit real network/services (deselect with '-m \"not integration\"')",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["tools", "agents", "tui", "commands"]

[tool.flake8]
max-line-length = 100
ignore = ["E501", "W503", "E203"]
exclude = ["venv", "__pycache__", ".git"]

[tool.pyrefly]
disable-search-path-heuristics = true
search-path = ["."]
